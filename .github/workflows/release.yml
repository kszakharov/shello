name: Create GitHub Release

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build-deb:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       contains(github.event.workflow_run.head_branch, '.'))
    uses: ./.github/workflows/deb.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  release:
    runs-on: ubuntu-latest
    needs: build-deb
    if: >-
      needs.build-deb.result == 'success' &&
      (github.event_name == 'workflow_run' ||
       startsWith(github.ref_name, 'v'))
    env:
      TZ: America/Toronto
    permissions:
      contents: write

    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a version tag: $TAG"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Get version
        id: vars
        run: echo "version=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          sed -n "/^## \[$VERSION\]/,/^## \[/{
            /^## \[$VERSION\]/d              # remove the version header
            /^## \[/q                        # stop at next header
            p                                # print everything else
          }" CHANGELOG.md | sed '/./,$!d;${/^$/d}' > RELEASE_NOTES.md

          delimiter="$(openssl rand -hex 8)"
          echo "release_notes<<$delimiter" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          name: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          body: ${{ steps.changelog.outputs.release_notes }}
          files: dist/*.deb
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
